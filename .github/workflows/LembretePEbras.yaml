name: Lembrete PEbras

on:
  schedule:
    - cron: "30 12 * * TUE,FRI"   # terça e sexta às 12:30 UTC (09:30 BRT)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Criar script de email
        run: |
          cat <<EOF > send_email.py
          import smtplib
          from email.mime.text import MIMEText
          import os

          EMAIL_USER = os.environ['EMAIL_USER']
          EMAIL_PASS = os.environ['EMAIL_PASS']
          EMAIL_DEST = os.environ['EMAIL_DEST']

          msg = MIMEText("Verificar edital PEbras")
          msg['Subject'] = "Lembrete"
          msg['From'] = EMAIL_USER
          msg['To'] = EMAIL_DEST

          with smtplib.SMTP('smtp.gmail.com', 587) as server:
              server.starttls()
              server.login(EMAIL_USER, EMAIL_PASS)
              server.send_message(msg)

          print("Email enviado com sucesso!")
          EOF

      - name: Enviar Email
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_DEST: ${{ secrets.EMAIL_DEST }}
        run: python send_email.py
