
name: Resident Evil Prompt + Image (Gemini)

on:
  schedule:
    - cron: '0 15 * * *'   # 1x por dia para começar
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -U google-genai pillow

      - name: Generate prompt
        run: |
          python Resident-evil-prompts/prompt_generator.py

      - name: Generate image with Gemini (Imagen 3)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python Resident-evil-prompts/image_generator_gemini.py

      - name: Commit prompt and image
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add Resident-evil-prompts
          git commit -m "New Resident Evil prompt and image (Gemini)"
          git push


