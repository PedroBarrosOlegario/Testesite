
name: Gemini Resident Evil Prompt Generator

on:
  schedule:
    # 5 vezes por dia
    - cron: '0 3,8,13,18,23 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run prompt generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python Resident-evil-prompts/prompt_generator.py

      - name: Commit generated prompts
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add Resident-evil-prompts
          git commit -m "New Resident Evil cinematic prompt"
          git push
``
