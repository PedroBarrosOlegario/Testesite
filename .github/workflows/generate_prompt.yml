
name: Resident Evil Prompt and Image Generator

on:
  schedule:
    - cron: '0 15 * * *'   # 1x por dia (seguro para começar)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Generate prompt
        run: |
          python Resident-evil-prompts/prompt_generator.py

      - name: Generate image from prompt
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          python Resident-evil-prompts/image_generator.py

      - name: Commit prompt and image
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add Resident-evil-prompts
          git commit -m "New Resident Evil prompt and image"
          git push
