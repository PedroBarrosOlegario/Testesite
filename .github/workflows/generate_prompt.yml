name: Resident Evil Prompt + Image (Cloudflare)

on:
  schedule:
    - cron: '0 15 * * *'   # 1x por dia
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Generate prompt
        run: |
          python Resident-evil-prompts/prompt_generator.py

      - name: Generate image with Cloudflare SDXL
        env:
          CLOUD_FLARE_API: ${{ secrets.CLOUD_FLARE_API }}
          CLOUDFLARE_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT }}
        run: |
          python Resident-evil-prompts/image_generator_cloudflare.py

      - name: Commit prompt and image
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add Resident-evil-prompts
          git commit -m "New Resident Evil prompt and image (Cloudflare SDXL)"
          git push
